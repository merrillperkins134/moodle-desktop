<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Nextcloud Vector View</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Native quick-jump sidebar, rendered outside the webview -->
      <nav id="sidebar" aria-label="Nextcloud sections">
        <div class="sidebar-top" id="sidebar-apps">
          <!-- Populated dynamically from the user's Nextcloud navigation -->
        </div>

        <div class="sidebar-bottom">
          <button id="btn-reload" class="nav-btn" title="Reload" aria-label="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          </button>
          <button id="btn-settings" class="nav-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM3 12h2m14 0h2M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
          </button>
        </div>
      </nav>

      <!-- Embedded Nextcloud Hub -->
      <main id="content">
        <webview
          id="view"
          partition="persist:nextcloud"
          useragent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          allowpopups
        ></webview>

        <!-- Loading indicator -->
        <div id="loading" class="overlay" hidden>
          <div class="spinner"></div>
          <p>Loading your Nextcloud…</p>
        </div>

        <!-- Friendly error / retry screen -->
        <div id="error" class="overlay" hidden>
          <div class="error-card">
            <svg viewBox="0 0 24 24" class="error-icon" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm0 6v6m0 4h.01"/></svg>
            <h1>Can't reach your Nextcloud</h1>
            <p id="error-detail">The server didn't respond. Check that it's online and that your server URL is correct.</p>
            <p class="error-url" id="error-url"></p>
            <div class="error-actions">
              <button id="btn-retry" class="btn primary">Retry</button>
              <button id="btn-error-settings" class="btn">Open Settings</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
