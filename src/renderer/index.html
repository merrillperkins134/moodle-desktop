<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Nextcloud Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Native quick-jump sidebar, rendered outside the webview -->
      <nav id="sidebar" aria-label="Nextcloud sections">
        <div class="sidebar-top">
          <button class="nav-btn" data-path="/apps/dashboard" title="Dashboard" aria-label="Dashboard">
            <!-- grid -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/files" title="Files" aria-label="Files">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/mail" title="Mail" aria-label="Mail">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 4 8 5 8-5"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/calendar" title="Calendar" aria-label="Calendar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM3 9h18"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/spreed" title="Talk" aria-label="Talk">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/contacts" title="Contacts" aria-label="Contacts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0v1H5v-1z"/></svg>
          </button>
          <button class="nav-btn" data-path="/apps/deck" title="Deck" aria-label="Deck">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4V4zm6 0h4v16h-4V4zm6 0h4v16h-4V4z"/></svg>
          </button>
        </div>

        <div class="sidebar-bottom">
          <button id="btn-reload" class="nav-btn" title="Reload" aria-label="Reload">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
          </button>
          <button id="btn-settings" class="nav-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM3 12h2m14 0h2M12 3v2m0 14v2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
          </button>
        </div>
      </nav>

      <!-- Embedded Nextcloud Hub -->
      <main id="content">
        <webview
          id="view"
          partition="persist:nextcloud"
          useragent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          allowpopups
        ></webview>

        <!-- Loading indicator -->
        <div id="loading" class="overlay" hidden>
          <div class="spinner"></div>
          <p>Loading your Nextcloud…</p>
        </div>

        <!-- Friendly error / retry screen -->
        <div id="error" class="overlay" hidden>
          <div class="error-card">
            <svg viewBox="0 0 24 24" class="error-icon" aria-hidden="true"><path d="M12 2 1 21h22L12 2zm0 6v6m0 4h.01"/></svg>
            <h1>Can't reach your Nextcloud</h1>
            <p id="error-detail">The server didn't respond. Check that it's online and that your server URL is correct.</p>
            <p class="error-url" id="error-url"></p>
            <div class="error-actions">
              <button id="btn-retry" class="btn primary">Retry</button>
              <button id="btn-error-settings" class="btn">Open Settings</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
