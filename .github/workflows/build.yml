name: Build & Release

on:
  push:
    branches: [claude/eloquent-pasteur-2tpgm]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run generate-icons

      - name: Build .deb and AppImage
        run: npx electron-builder --linux deb AppImage --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-desktop-linux-x64
          path: |
            dist-build/*.deb
            dist-build/*.AppImage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: Nextcloud Desktop v1.0.0
          body: |
            ## Nextcloud Desktop v1.0.0

            Native desktop wrapper for your self-hosted Nextcloud Hub on Zorin OS 17 / Ubuntu 22.04 (x86_64).

            ### Install

            **`.deb` (recommended for Zorin/Ubuntu):**
            ```bash
            sudo apt install ./nextcloud-desktop_1.0.0_amd64.deb
            ```

            **AppImage (no install needed):**
            ```bash
            chmod +x "Nextcloud Desktop-1.0.0-x86_64.AppImage"
            ./"Nextcloud Desktop-1.0.0-x86_64.AppImage"
            ```

            After launching, click the ⚙ Settings button in the sidebar and enter your Nextcloud server URL.
          draft: false
          prerelease: false
          files: |
            dist-build/*.deb
            dist-build/*.AppImage
          fail_on_unmatched_files: true
